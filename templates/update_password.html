{% extends 'admin_dashboard.html' %}

{% block content %}
<h3>Update Password for {{ user.username }}</h3>

<form method="POST" onsubmit="return validatePasswordForm()">
    <div class="mb-3">
        <label for="password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Update Password</button>
</form>
<script>
    function validatePasswordForm() {
        const password = document.getElementById('password').value;
        const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{6,}$/;
        if (!password.match(passwordPattern)) {
            alert("Password must contain at least 6 characters, including at least one uppercase letter, one lowercase letter, one number, and one special character.");
            return false; 
        }
        return true; 
    }
</script>

{% endblock %}
