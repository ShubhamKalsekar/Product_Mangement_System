<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }

        /* Sidebar Styles */
        .sidebar {
            background-color: #2c3e50;
            color: #fff;
            height: 100vh;
            padding: 20px;
            position: fixed;
            width: 290px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #ecf0f1;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 4px;
        }

        .sidebar ul li a:hover,
        .sidebar ul li a.active {
            background-color: #1abc9c;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 260px;
            padding: 20px 10pc;
            background-color: #f8f9fa;
        }

        .main-content h2 {
            font-weight: bold;
            color: #2c3e50;
        }

        .form {

            background: white;
            padding: 30px 20px 30px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 10px 100px;
            width: 500px;
        }


        .form-container {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        .form-container label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-container .form-control {
            border-radius: 5px;
        }

        .form-container button {
            background-color: #1abc9c;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .form-container button:hover {
            background-color: #16a085;
        }

        .product-photo img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Dashboard</h3>
            <ul>
                <li><a href="{{ url_for('product_manager_dashboard') }}" class="active">Home</a></li>
                <li><a href="{{ url_for('product_manager_add_product') }}"
                        class="{{ 'active' if request.endpoint == 'product_manager_add_product' else '' }}">Add
                        Product</a></li>
                <li><a href="{{ url_for('add_category') }}"
                        class="{{ 'active' if request.endpoint == 'add_category' else '' }}">Add Category</a></li>

                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <h2>Edit Product</h2>

            <div class="edit-product-form">
                <form method="POST" action="/edit_manager/{{ product.id }}" enctype="multipart/form-data"
                    onsubmit="return validateForm()">
                    <label for="product_name">Product Name:</label>
                    <input type="text" id="product_name" name="product_name" value="{{ product.name }}" required><br>

                    <label for="product_price">Price:</label>
                    <input type="number" id="product_price" name="product_price" value="{{ product.price }}"
                        required><br>

                    <label for="category">Product Type:</label>
                    <select name="category" id="category" required>
                        {% for category in categories %}
                        <option value="{{ category }}" {% if category==selected_category %}selected{% endif %}>{{
                            category }}</option>
                        {% endfor %}

                    </select><br>

                    <label for="stock">Stock Quantity:</label>
                    <input type="number" id="stock" name="stock" value="{{ product.stock }}" required><br>

                    <label for="type_description">Product Description:</label>
                    <textarea name="type_description" id="type_description" rows="4"
                        required>{{ product.type_description }}</textarea><br>

                    <label for="product_photo">Product Photo:</label>
                    <input type="file" id="product_photo" name="photo" accept="image/*"><br>

                    {% if product.photo %}
                    <p>Current Photo: <img src="{{ url_for('static', filename='uploads/' + product.photo) }}"
                            width="100px"></p>
                    {% else %}
                    <p>No photo uploaded.</p>
                    {% endif %}

                    <button type="submit">Update Product</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function validateForm() {
            const productName = document.getElementById('product_name').value;
            if (productName.length < 2) {
                alert("Product name must be at least 2 characters.");
                return false;
            }
            const productPrice = document.getElementById('product_price').value;
            if (productPrice <= 0) {
                alert("Price must be a positive number.");
                return false;
            }

            const productDescription = document.getElementById('type_description').value;
            if (productDescription.length < 3) {
                alert("Description must be at least 3 characters.");
                return false;
            }

            const productPhoto = document.getElementById('product_photo').value;
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            const fileInput = document.getElementById('product_photo');
            const file = fileInput.files[0];
            if (file && !allowedTypes.includes(file.type)) {
                alert("Please upload a valid image (JPEG, PNG, webp,or GIF).");
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
